

title: Caden Tebow
tagline: University of Chicago - B.S Physics & Computer Science
author: Caden Tebow
email: ctebow@uchicago.edu
description: >-
  Personal portfolio and project notes of Caden Tebow.

# --- URLs -----------------------------------------------------
# For a user site (repo named ctebow.github.io):
#   url: "https://ctebow.github.io"   and   baseurl: ""
# For a project site (repo named e.g. "portfolio"):
#   url: "https://ctebow.github.io"   and   baseurl: "/portfolio"
url: "https://ctebow.github.io"
baseurl: ""

github_username: ctebow
linkedin_username: 
twitter_username:
scholar_url:
resume_url: "/assets/resume.pdf"      # drop your PDF at assets/resume.pdf

# favicon: "assets/img/favicon.png"   # uncomment once you drop a file there
theme: no-style-please

theme_config:
  back_home_text: ".."               
  date_format: "%Y-%m-%d"
  show_description: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "" }
    values: { layout: "page" }

permalink: /writing/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - GUIDE.md
  - .jekyll-cache/
